name: design-gates

# WHY THIS FILE EXISTS. Every gate below already existed and every one of them
# was green on the day it was written — and none of them ran unless somebody
# typed the command. That is not a hypothetical: «Soft rect, not circles» was
# decided, applied, documented, and then silently undone by a second rule in
# the same file, and the product drew pills for another day while the doc said
# otherwise. A guard nobody runs is a paragraph with a shebang.
#
# Deliberately separate from `admin-smoke`: that job needs deploy secrets and
# optional browsers, this one needs nothing but the repo. Design work should
# not wait on a smoke suite, and a missing secret should not make the design
# gates look green.

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same source of truth as admin-smoke: .nvmrc, so CI and local dev cannot
      # disagree about the npm resolver.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      # THE TOKENS ARE CODEGEN. `tokens:check` regenerates from
      # cw.tokens.json and fails if globals.css moves — the one check that
      # catches a hand-edit inside a marker block, which is invisible in review
      # and is silently reverted by the next build.
      - name: Tokens are generated, not typed
        run: npm run -s tokens:check

      # The mirror bundle is derived from the same JSON. Out of sync here means
      # the Claude Design project is being shown a design system this repo no
      # longer ships.
      - name: DS bundle in sync with the tokens
        run: npm run -s ds:sync:check

      # Code vs mirror, gated on CONFLICTS only — a token whose value differs
      # between the two. One-sided entries are expected and documented in
      # design.drift.json; a conflict never is.
      - name: Code and mirror agree on every shared token
        run: npm run -s ds:drift:gate

      # The architectural rules that live in eslint.config.mjs, checked against
      # violations they must catch. `npm run lint` proves the code is clean;
      # this proves the rules would have said so.
      - name: ESLint guard rules still bite
        run: npm run -s guard:eslint

      - name: Platform canon
        run: npm run -s canon:guard

      - name: Assets referenced exist
        run: npm run -s guard:assets

      - name: Brand mark
        run: npm run -s brand:check

      - name: Shared DS contract
        run: npm run -s guard:ds-contract

      - name: Contrast
        run: npm run -s guard:contrast

      - name: Button contract
        run: npm run -s guard:buttons

      # Radius, spacing and type: one vocabulary, the box decides the step, and
      # two ratchets that fail on the next new literal rather than on the ones
      # already counted. See docs/design-system/geometry-audit-2026-09-07.md.
      - name: Geometry
        run: npm run -s guard:geometry

      - name: Generated screens
        run: npm run -s generator:validate

      - name: Semantic architecture
        run: npm run -s semantic:audit

      # docs/README.md is generated from the files' own headings; a note added
      # without regenerating it is the drift this catches.
      - name: Docs index is current
        run: npm run -s docs:index:check
