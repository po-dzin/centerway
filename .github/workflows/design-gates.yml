name: design-gates

# WHY THIS FILE EXISTS. Every gate below already existed and every one of them
# was green on the day it was written — and none of them ran unless somebody
# typed the command. That is not a hypothetical: «Soft rect, not circles» was
# decided, applied, documented, and then silently undone by a second rule in
# the same file, and the product drew pills for another day while the doc said
# otherwise. A guard nobody runs is a paragraph with a shebang.
#
# Deliberately separate from `admin-smoke`: that job needs deploy secrets and
# optional browsers, this one needs nothing but the repo. Design work should
# not wait on a smoke suite, and a missing secret should not make the design
# gates look green.

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

# Read-only token: nothing in this job writes to the repository or the PR.
permissions:
  contents: read

# A newer push to the same branch makes the older run moot. Cancelled only on
# pull requests: every push to main still finishes, so main keeps a result for
# each commit.
concurrency:
  group: design-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same source of truth as admin-smoke: .nvmrc, so CI and local dev cannot
      # disagree about the npm resolver.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      # Every check that reads the repository and decides — design system,
      # canon, generated screens, the ESLint architecture rules, and the four
      # admin gates that used to run again in admin-smoke. The list and the
      # reason for each gate live in scripts/verify-guards.mjs: one place, and
      # runnable before a push rather than only after one. It does not stop at
      # the first failure, so a red run names every broken gate.
      - name: Static guards
        run: npm run -s verify:guards
