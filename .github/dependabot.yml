# Dependency updates, MONTHLY, grouped so the branch does not fill with one PR
# per package. Each group is one PR; the CI on it is the same admin-smoke and
# design-gates every other PR gets. Vercel builds are rate-limited on Hobby, so
# fewer, larger PRs is deliberate — see docs on the build limit.
#
# MONTHLY, NOW THAT SECURITY UPDATES ARE ON (2026-09-15). Few weekly version
# PRs were ever merged, so keeping current is a monthly chore. The urgent case —
# a vulnerable dependency — is Dependabot alerts + SECURITY updates, enabled in
# the repository settings (Settings → Advanced Security) on 2026-09-15; they open
# a fix PR when an advisory lands and do not wait for this schedule. If those
# settings are ever switched off, put this interval back to weekly.
# The miss that prompted this: sharp 0.34.5 carried libvips/libheif advisories
# whose fix is 0.35 — a "major" by npm's 0.x rule, so the ignore below meant a
# version PR for it would never have come.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 2
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        dependency-type: development
        exclude-patterns: ["@types/react", "@types/react-dom", "eslint-config-next"]
    ignore:
      # Majors are a decision, not an update: they land by hand with a smoke run.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Same rule as npm: a major Actions upgrade (checkout/setup-node v4 → v7
      # arrived 2026-09-11) is taken by hand with a smoke run, not by a bot.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
